<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dota 2 Clicker</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1b1e21;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        #score-container {
            font-size: 40px;
            margin-bottom: 20px;
            color: #ff4d4d;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.3);
        }

        #clicker-circle {
            width: 220px;
            height: 220px;
            background-color: #e31e25;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(227, 30, 37, 0.4);
            transition: transform 0.05s ease;
            position: relative;
        }

        #clicker-circle:active {
            transform: scale(0.92);
        }

        #clicker-circle img {
            width: 70%;
            pointer-events: none;
        }

        .floating-text {
            position: absolute;
            color: #ffffff;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: moveUp 0.6s ease-out forwards;
            z-index: 100;
        }

        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="score-container">MMR: <span id="score">0</span></div>
    
    <div id="clicker-circle" id="btn">
        <img src="https://steamstatic.com" alt="DOTA">
    </div>

    <p style="margin-top: 25px; opacity: 0.5; letter-spacing: 1px;">CLICK TO WIN</p>

    <script>
        // Инициализация
        const scoreElement = document.getElementById('score');
        const clickerBtn = document.getElementById('clicker-circle');
        let score = 0;

        // Обработка клика
        clickerBtn.addEventListener('pointerdown', (e) => {
            // 1. Увеличиваем счет
            score += 25;
            scoreElement.innerText = score;

            // 2. Создаем эффект +25
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = '+25';
            
            // Позиция текста (берем координаты клика)
            text.style.left = (e.clientX - 20) + 'px';
            text.style.top = (e.clientY - 20) + 'px';
            
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 600);

            // 3. Работа с Telegram (если открыто в ТГ)
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                
                // Вибрация
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            }
        });

        // Сообщаем Telegram, что все ок
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
